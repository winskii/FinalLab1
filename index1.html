<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Info Card</title>

    <link rel="stylesheet" href="style1.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>User Info Card</h1>
            <p>Enter your information below</p>
        </div>

        <div class="card">

            <form id="userForm">

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" placeholder="Enter your age">
                </div>

                <div class="form-group">
                    <label for="birthday">Birthday</label>
                    <input type="date" id="birthday">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="Enter your phone number">
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" placeholder="Enter your address">
                </div>

                <div class="form-group">
                    <label for="school">School</label>
                    <input type="text" id="school" placeholder="Enter your school">
                </div>

                <div class="form-group">
                    <label for="course">Course</label>
                    <input type="text" id="course" placeholder="Enter your course">
                </div>

                <div class="form-group">
                    <label for="favoriteFood">Favorite Food</label>
                    <input type="text" id="favoriteFood" placeholder="Enter your favorite food">
                </div>

                <div class="form-group">
                    <label for="hobby">Hobby</label>
                    <input type="text" id="hobby" placeholder="Enter your hobby">
                </div>

                <div class="form-group">
                    <label for="favoriteColor">Favorite Color</label>

                    <select id="favoriteColor">
                        <option value="">Select a color</option>
                        <option value="Red">Red</option>
                        <option value="Blue">Blue</option>
                        <option value="Green">Green</option>
                        <option value="Yellow">Yellow</option>
                        <option value="Purple">Purple</option>
                        <option value="Black">Black</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Gender</label>

                    <div class="radio-group">
                        <label>
                            <input type="radio" name="gender" value="Male">
                            Male
                        </label>

                        <label>
                            <input type="radio" name="gender" value="Female">
                            Female
                        </label>

                        <label>
                            <input type="radio" name="gender" value="Prefer not to say">
                            Prefer not to say
                        </label>
                    </div>
                </div>

                <button type="button" id="showButton">
                    Show My Info
                </button>

            </form>

        </div>


        <!-- OUTPUT SECTION -->

        <div class="output-card" id="outputCard">

            <h2>My Information</h2>

            <div class="info-list">

                <p class="info-item">
                    <strong>Full Name:</strong>
                    <span id="outputName">---</span>
                </p>

                <p class="info-item">
                    <strong>Email:</strong>
                    <span id="outputEmail">---</span>
                </p>

                <p class="info-item">
                    <strong>Age:</strong>
                    <span id="outputAge">---</span>
                </p>

                <p class="info-item">
                    <strong>Birthday:</strong>
                    <span id="outputBirthday">---</span>
                </p>

                <p class="info-item">
                    <strong>Phone Number:</strong>
                    <span id="outputPhone">---</span>
                </p>

                <p class="info-item">
                    <strong>Address:</strong>
                    <span id="outputAddress">---</span>
                </p>

                <p class="info-item">
                    <strong>School:</strong>
                    <span id="outputSchool">---</span>
                </p>

                <p class="info-item">
                    <strong>Course:</strong>
                    <span id="outputCourse">---</span>
                </p>

                <p class="info-item">
                    <strong>Favorite Food:</strong>
                    <span id="outputFood">---</span>
                </p>

                <p class="info-item">
                    <strong>Hobby:</strong>
                    <span id="outputHobby">---</span>
                </p>

                <p class="info-item">
                    <strong>Favorite Color:</strong>
                    <span id="outputColor">---</span>
                </p>

                <p class="info-item">
                    <strong>Gender:</strong>
                    <span id="outputGender">---</span>
                </p>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
